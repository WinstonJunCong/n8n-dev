test: Down site sends an alert
trigger:                       # fake incoming webhook body
  site: docs
mocks:                         # fake outputs for every outside step on this path
  "Load env_config":
    - { STATUS_URL: "https://status.example.test/check", ALERT_URL: "https://alerts.example.test/send" }
  "Check site status":
    - { status: down, latency_ms: 1200 }
  "Send alert":
    - { ok: true }
assert:
  - node "Send alert" called 1 time
  - 'node "Send alert" input.text contains "ALERT: docs is not healthy (status: down, 1200 ms)"'
  - node "Ignore healthy site" not called
  - workflow ends at "Send alert"
